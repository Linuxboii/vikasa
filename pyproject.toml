[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vikasa"
version = "1.1.0"
description = "A deterministic artificial-life laboratory for observable evolution"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vikasa Contributors" }]
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.1",
  "pandas>=2.2",
  "pygame-ce>=2.5",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
vikasa = "evolution_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evolution_sim"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = ["slow: long-running stress and performance tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

